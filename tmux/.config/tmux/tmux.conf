# ~/.config/tmux/tmux.conf
# 自動保存: tmux-continuum が 5 分ごとに保存
# 自動復元: tmux サーバー起動時に continuum が最後の保存を復元
#           WezTerm を開くと `tmux new -A -s main` が走るので、再起動後も WezTerm を開くだけで戻る

# プラグインと保存データは XDG data に置く（stow でリンクした設定ディレクトリに書き込ませない）
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"

# --- terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
# truecolor と undercurl（LSP 診断の波線）を外側のターミナルに通す
set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-features ",wezterm:RGB:usstyle"

# Neovim 向け: ESC の遅延をなくす / フォーカス変化を伝える（autoread, gitsigns の更新）
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# --- keys -------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane # ドラッグ後に copy-mode を抜けない

# --- plugins ----------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl-hjkl で nvim と pane を行き来
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # セッションの保存・復元
set -g @plugin 'tmux-plugins/tmux-continuum'    # 自動保存・自動復元

set -g @themepack 'powerline/default/cyan'

# resurrect
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
# nvim: Session.vim があればそれで復元。無ければ nvim を起動し、auto-session が cwd のセッションを開く
set -g @resurrect-strategy-nvim 'session'
# 既定（vim nvim less man top など）に加えて復元するプログラム
set -g @resurrect-processes 'lazygit yazi btop "~claude"'

# continuum
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# TPM の初期化（必ず最後）
run '~/.local/share/tmux/plugins/tpm/tpm'
